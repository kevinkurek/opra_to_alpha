networks:
  default:
    external: true
    name: lakehouse

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    volumes:
      - minio-data:/data

  # Trino coordinator; catalogs read from ./trino/catalog.
  trino:
    image: trinodb/trino:latest
    ports:
      - "8081:8081"
    volumes:
      - ./etc/catalog:/etc/trino/catalog
      - ./etc/config.properties:/etc/trino/config.properties:ro
    depends_on:
      - minio

volumes:
  minio-data:


