# docker-compose.yaml
networks:
  default:
    external: true
    name: lakehouse

services:
  # S3-compatible object store
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API -> http://localhost:9000
      - "9001:9001"   # Console -> http://localhost:9001
    volumes:
      - minio-data:/data

  # Trino coordinator (single-node; add workers later if desired)
  trino:
    image: trinodb/trino:latest
    ports:
      - "8081:8081"   # Trino UI -> http://localhost:8081
    volumes:
      - ./etc/catalog:/etc/trino/catalog
      - ./etc/config.properties:/etc/trino/config.properties:ro
    depends_on:
      - minio
      - iceberg-db

  # Postgres for Iceberg JDBC catalog (metadata only)
  iceberg-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iceberg
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: iceberg
    volumes:
      - iceberg-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iceberg -d iceberg || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  minio-data:
  iceberg-db-data: