# Use an existing Docker network named "lakehouse"
# This keeps all services on the same user-defined bridge network.
networks:
  default:
    external: true
    name: lakehouse

services:
  # ⭐ MinIO object store (S3-compatible). Stores data for Hive/Iceberg/Trino.
  minio:
    image: minio/minio:RELEASE.2025-03-12T18-04-18Z
    # Start the object store; expose the web console on :9001 inside the container.
    command: server --address ":9000" --console-address ":9001" /data
    environment:
      # Root credentials used by clients (Trino/Hive) to access S3 API.
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      # Publish S3 API to host port 9000 → clients use http://localhost:9000
      - "9000:9000"   # S3 API
      # Publish MinIO Console (UI) to host port 9001 → http://localhost:9001
      - "9001:9001"   # Console
    volumes:
      # Persist MinIO object data on a Docker named volume.
      - minio-data:/data

  # ⭐ Trino query coordinator. Connects to catalogs defined in ./etc/catalog.
  # Trino lets you query Iceberg/Hive tables stored in MinIO (S3).
  trino:
    # Pull the latest Trino image.
    image: trinodb/trino:latest
    ports:
      # Expose Trino's web UI / coordinator port to the host at 8081.
      - "8081:8081"
    volumes:
      # Mount your catalog *.properties files (e.g., iceberg.properties, hive.properties).
      - ./etc/catalog:/etc/trino/catalog
      # Mount Trino's main config (http port, memory, etc.); read-only.
      - ./etc/config.properties:/etc/trino/config.properties:ro
    depends_on:
      # Ensure MinIO is started before Trino attempts to read/write S3.
      - minio

  hivemeta-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: hive_metastore
    volumes:
      - hivemeta-pg-data:/var/lib/postgresql/data

  # ⭐ Hive Metastore (HMS). Stores table/partition metadata in Postgres (JDO),
  # and serves it via Thrift on port 9083 for Trino/Spark/Hive clients.
  hive-metastore:
    # Official Apache Hive 4 image (includes metastore service).
    image: apache/hive:4.0.0
    # Name the container so it’s easy to exec/logs against.
    container_name: hive-metastore
    environment:
      # Ask the image to run the metastore service (vs. CLI or hiveserver2).
      SERVICE_NAME: metastore
      # Hint that we use Postgres as the JDO backend (driver is provided below via JAR + hive-site.xml).
      DB_DRIVER: postgres

      # Point Hadoop/Hive to where core-site.xml is mounted (S3A/MinIO settings live there).
      # This tells the HMS how to access S3-compatible storage.
      HADOOP_CONF_DIR: /etc/hadoop/conf

      # Make sure Hadoop sees the S3A libraries (hadoop-aws + aws SDK).
      HADOOP_CLASSPATH: /opt/hadoop/share/hadoop/tools/lib/hadoop-aws-3.3.6.jar:/opt/hadoop/share/hadoop/tools/lib/aws-java-sdk-bundle-1.12.262.jar
      # Make sure Hive itself also sees those libs and the Postgres JDBC driver.
      HIVE_AUX_JARS_PATH: /opt/hive/lib/postgresql-42.7.3.jar,/opt/hadoop/share/hadoop/tools/lib/hadoop-aws-3.3.6.jar,/opt/hadoop/share/hadoop/tools/lib/aws-java-sdk-bundle-1.12.262.jar

    volumes:
      # Mount hive-site.xml (contains metastore URI and JDO/Postgres connection properties).
      # The image reads /opt/hive/conf automatically on startup.
      - ./hive/conf:/opt/hive/conf:ro # ro: read-only
      # Mount the Postgres JDBC driver so HMS can connect to the metastore DB.
      - ./hive/lib/postgresql-42.7.3.jar:/opt/hive/lib/postgresql-42.7.3.jar:ro
      # Mount Hadoop S3A connector JAR (needed if not bundled in the image).
      - ./jars/hadoop-aws-3.3.6.jar:/opt/hadoop/share/hadoop/tools/lib/hadoop-aws-3.3.6.jar:ro
      # Mount AWS SDK bundle used by S3A connector.
      - ./jars/aws-java-sdk-bundle-1.12.262.jar:/opt/hadoop/share/hadoop/tools/lib/aws-java-sdk-bundle-1.12.262.jar:ro
      # Mount Hadoop core-site.xml (defines fs.s3a.* endpoint/creds/path-style for MinIO).
      - ./hadoop/conf/core-site.xml:/etc/hadoop/conf/core-site.xml:ro
    ports:
      # Publish the Hive Metastore Thrift service to host port 9083.
      - "9083:9083"
    depends_on:
      - hivemeta-postgres
      # HMS needs MinIO reachable if it touches object storage on startup/migrations.
      - minio

volumes:
  # Named volume to persist MinIO object data across container recreations.
  minio-data:
  hivemeta-pg-data:
