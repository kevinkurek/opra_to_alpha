networks:
  default:
    external: true
    name: lakehouse

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    volumes:
      - minio-data:/data

  # Trino coordinator; catalogs read from ./trino/catalog.
  trino:
    image: trinodb/trino:latest
    ports:
      - "8081:8081"
    volumes:
      - ./etc/catalog:/etc/trino/catalog
      - ./etc/config.properties:/etc/trino/config.properties:ro

      # Hadoop config
      - ./hadoop/conf/core-site.xml:/etc/hadoop/conf/core-site.xml:ro

      # JARs for S3A support
      - ./jars/hadoop-aws-3.3.6.jar:/usr/lib/trino/plugin/hive/hadoop-aws-3.3.6.jar:ro
      - ./jars/aws-java-sdk-bundle-1.12.262.jar:/usr/lib/trino/plugin/hive/aws-java-sdk-bundle-1.12.262.jar:ro
      - ./jars/hadoop-aws-3.3.6.jar:/usr/lib/trino/plugin/iceberg/hadoop-aws-3.3.6.jar:ro
      - ./jars/aws-java-sdk-bundle-1.12.262.jar:/usr/lib/trino/plugin/iceberg/aws-java-sdk-bundle-1.12.262.jar:ro
    depends_on:
      - minio

  hive-metastore:
    image: apache/hive:4.0.0
    container_name: hive-metastore
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      # Tell Hive where/how to connect to Postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://airflow-docker-postgres-1:5432/hive_metastore
        -Djavax.jdo.option.ConnectionUserName=hive_meta
        -Djavax.jdo.option.ConnectionPassword=hivepw
      # Make sure the PG JDBC jar is on the classpath Hive uses
      HIVE_AUX_JARS_PATH: /opt/hive/lib/postgresql-42.7.3.jar
      # Optional: more verbose init logs
      VERBOSE: "true"
    volumes:
      # Your custom hive-site.xml (ok to keep)
      - ./hive/conf:/opt/hive/conf:ro
      # Mount the PG JDBC driver you downloaded
      - ./hive/lib/postgresql-42.7.3.jar:/opt/hive/lib/postgresql-42.7.3.jar:ro
      - ./hadoop/conf/core-site.xml:/etc/hadoop/conf/core-site.xml:ro
    ports:
      - "9083:9083"
    depends_on:
      - minio
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/9083 && echo ok || exit 1'"]
      interval: 5s
      timeout: 3s
      retries: 40

volumes:
  minio-data:
  hive-metastore-data:


