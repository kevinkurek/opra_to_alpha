# ./trino/etc/config.properties
http-server.http.port=8081
# discovery.uri=http://localhost:8081 # Minimal single-node Trino (coordinator also acts as worker)
discovery.uri=http://trino:8081
# Keep query memory under JVM heap to reduce OOM risk on local Docker.
query.max-memory-per-node=1GB
memory.heap-headroom-per-node=512MB
