connector.name=hive
hive.metastore.uri=thrift://hive-metastore:9083

# Use Trino's native S3 client (not Hadoop FS)
fs.native-s3.enabled=true

# MinIO credentials + endpoint (generic s3.* keys)
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin

# # ALL of these result in Error: Configuration property was not used
# # hdfs.config.resources=/etc/hadoop/conf/core-site.xml
# # hive.config.resources=/etc/hadoop/conf/core-site.xml