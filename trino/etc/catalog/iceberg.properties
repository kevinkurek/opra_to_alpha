connector.name=iceberg
iceberg.catalog.type=jdbc

# Postgres for the Iceberg catalog (the Airflow Postgres container)
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://airflow-docker-postgres-1:5432/iceberg
iceberg.jdbc-catalog.connection-user=etl
iceberg.jdbc-catalog.connection-password=demopass
iceberg.jdbc-catalog.catalog-name=catalog_dw
iceberg.jdbc-catalog.default-warehouse-dir=s3://warehouse
# iceberg.jdbc-catalog.catalog-schema=iceberg

# MinIO S3
fs.hadoop.enabled=false
fs.native-s3.enabled=true
s3.endpoint=http://trino-minio-1:9000
s3.region=us-east-1
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin
s3.path-style-access=true