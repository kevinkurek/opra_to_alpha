services:
  # ---------- Trino & MinIO ----------
  trino:
    image: trinodb/trino
    hostname: trino
    volumes:
      - ./etc/catalog:/etc/trino/catalog
      - ./etc/config.properties:/etc/trino/config.properties:ro
    ports:
      - '8081:8081'
    depends_on:
      - minio

  minio:
    image: minio/minio
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
    ports:
      - 9000:9000
      - 9001:9001
    command: ["server", "/data", "--console-address", ":9001"]

  # ---------- Airflow ----------
  airflow_postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-volume:/var/lib/postgresql/data

  airflow_redis:
    image: redis:7.2-bookworm
    expose: [6379]

  airflow-scheduler:
    image: apache/airflow:3.1.0
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_postgres/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://airflow_redis:6379/0
    depends_on:
      - airflow_postgres
      - airflow_redis
    # … etc for workers, webserver, triggerer …

  # ---------- Superset ----------
  superset_postgres:
    image: postgres:16
    container_name: superset_db
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
      POSTGRES_DB: superset
    volumes:
      - superset-db-volume:/var/lib/postgresql/data

  superset_redis:
    image: redis:7
    container_name: superset_cache

  superset:
    build: .
    ports:
      - "8088:8088"
    depends_on:
      - superset_postgres
      - superset_redis