name: secret-guard tests

# Runs the .claude/hooks/secret-guard.sh test suite on every change to the
# hook itself, the test harness, or this workflow. Why the narrow paths
# filter: the hook is a defense-in-depth measure on the agent toolchain;
# the rest of the repo (Rust ingest, Terraform, Airflow, etc.) does not
# affect its correctness.

on:
  push:
    branches: [main]
    paths:
      - '.claude/hooks/secret-guard.sh'
      - '.claude/hooks/secret-guard.test.sh'
      - '.github/workflows/secret-guard-tests.yml'
  pull_request:
    paths:
      - '.claude/hooks/secret-guard.sh'
      - '.claude/hooks/secret-guard.test.sh'
      - '.github/workflows/secret-guard-tests.yml'
  workflow_dispatch:  # allow manual runs from the Actions tab

jobs:
  test:
    name: Run 26-case test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify dependencies
        run: |
          jq --version
          bash --version | head -1

      - name: Run secret-guard tests
        run: bash .claude/hooks/secret-guard.test.sh
