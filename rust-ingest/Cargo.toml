[package]
name = "opra-pcap-replayer"
version = "0.1.0"
edition = "2021"

[features]
default = []
gpu-cutile = ["dep:cutile", "dep:cutile-compiler"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.39", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
pcap-parser = "0.17"
bytes = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
opentelemetry = "0.23"
opentelemetry-otlp = { version = "0.16", features = ["grpc-tonic"] }
prometheus = "0.13"
arrow = "53"
parquet = "53"
zerocopy = "0.7"
bytemuck = { version = "1", features = ["derive"] }
aws-config = "1"
aws-sdk-s3 = "1"
rayon = "1.5"
chrono = "0.4"
databento = "0.46.0"
time = "0.3"
dotenvy = "0.15.7"
reqwest = "0.13.2"
serde = { version = "1", features = ["derive"] }
cutile = { git = "https://github.com/NVlabs/cutile-rs", package = "cutile", optional = true }
cutile-compiler = { git = "https://github.com/NVlabs/cutile-rs", package = "cutile-compiler", optional = true }

[dev-dependencies]
criterion = "0.5"
hex = "0.4"

[[bench]]
name = "decode_pcap"
harness = false

[profile.dev]
opt-level = 0
debug = 2
debug-assertions = true
split-debuginfo = "unpacked"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy] # come at me, clippy

# UM, ACTUALLY
pedantic = { level = "deny", priority = -1 }

# DEVELOPING LINTS
nursery = { level = "deny", priority = -1 }

# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_duration_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
